  P04:
      what_was_done:
        - "maestro/validation.py: the whole of P4's engineering. VerificationSpec /
           VerificationEvidence / AcceptanceDecision as §2.10 values; the four-hash
           Fingerprints and the functions that compute them; EvidenceRegistry (the only
           place a cache hit may be decided); CheckRunner; decide() as the closed-world
           boolean; ApprovalBinding (§5); and StagingPipeline as §3's five stages."
        - "Control store: verification_evidence gained the seven §2.10 columns P01 left
           out, acceptance_decisions is new, and _migrate_columns ALTERs an existing
           database (CREATE TABLE IF NOT EXISTS is a no-op on one that already has the
           table, so a SCHEMA-only column exists on fresh databases and nowhere else).
           record_evidence / find_current_evidence / record_acceptance / acceptances_for
           are controller-only writes."
        - "The three P3 stub handlers are real: verification runs the checks and reports
           evidence rows in outputs (a worker cannot write the evidence table — INV-01 —
           so runner._ingest_evidence commits them, under the attempt id the CONTROLLER
           believes in, not the one the report carried); merge and accept refuse outright
           without a controller handle."
        - "runner.dispatch now routes a node whose permissions_ref is in
           CONTROLLER_PERMISSIONS to execute_inline instead of tmux. The compiler already
           marked merge `controller_target_branch` and accept `controller_only`; this is
           where that declaration started having teeth. The inline path writes the same
           envelope/result/receipt a worker writes, so ingest, reconciliation and the
           event stream see ONE shape of completion."
        - "adapters.py declares ADAPTER_EFFECT_CLASSES, register_probe/probe_for and
           retry_allowed. deploy is the only non-repeatable kind; nothing ships a default
           probe, because a probe maestro invented for a project's deployment would be a
           guess, and a wrong probe AUTHORISES a retry."
        - "Verification: .venv/bin/python -m pytest -q tests/test_validation_evidence.py
           tests/test_integration_acceptance.py tests/characterization/test_gates.py
           tests/characterization/test_merge.py -> 344 passed, exit 0. Whole suite minus
           the pre-existing tests/test_limits.py failure also exit 0."
      decisions_worth_carrying:
        - "A task that declares NO verification is now REJECTED, not accepted. The legacy
           gate printed `No verifications defined — pass (no gate)` and returned 0, which
           is the DONE-file substitution one level up: the absence of a criterion became
           the satisfaction of one. decide() answers this first, before drift and before
           the per-check loop. Anything calling decide() with an empty spec list gets a
           rejection — that is deliberate and must not be given a bypass flag."
        - "The target branch is written in exactly ONE place: StagingPipeline.fast_forward,
           as `git update-ref <ref> <new> <expected-old>`. The compare-and-swap is what
           makes 'the target advanced during verification' a refusal rather than a silent
           overwrite, and it is one git operation on purpose — reading the head and then
           writing it is the same race with extra steps. There is no revert path anywhere
           in the staged flow because nothing is written before stage 4."
        - "gates.sonnet_review_proofs FIXED, not characterised: a judge answering `{}`
           produced no failures and read as all-pass, and one that reviewed three of five
           ids approved all five. Every manual id must now be present in the verdict map.
           tests/characterization/test_gates.py's pin was rewritten to record the closure
           (test_review_now_refuses_a_verdict_map_that_does_not_cover_what_was_sent). The
           invented-id half is unchanged. This is a P4 INV-04 fix, not a drive-by."
        - "merge_and_eval is UNTOUCHED. merge.integrate_candidate is the new seam and the
           legacy loop still calls the old one (D08 migrates one authority at a time).
           Nothing yet switches a project onto the staged path."
        - "CheckRunner.evaluate SKIPS reviewer checks rather than running them. A manual
           verification has no command, so 'running' it would mean asking a model and
           recording the answer as controller-executed proof. It enters decide() through
           review_dispositions, where review_is_conclusive scrutinises it visibly as a
           judgment."
      whats_left:

    notes: >-
      Delivered across two sessions. Session 1: model_api.py, model_runtime.py, the
      confinement extension ([INV-A08] namespacing + §4.2 CommitBoundary),
      test_model_runtime.py and the P7 section of test_confinement.py. Session 2 (this

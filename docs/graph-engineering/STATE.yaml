      .
      Fan-out is ONE mechanism, not a second lane. StageSpec grew a `fan_out` field
      ('candidates' | 'review_lenses'); the WIDTH is the policy's to compute
      (ProjectPolicy.fan_out_labels against the RiskContext), never the template's to
      state, so the same stage list compiles to paid mode's minimal graph, to a low-risk
      free graph, and to a fanned-out free graph. compose() now carries a LIST of previous
      node ids and joins every previous to every current; at width 1 it emits the stage's
      own node_id with no candidate label, which is why
      tests/workflows/test_compatibility.py passes untouched and every pre-P7 graph still
      compiles byte-identically. COMPILER_VERSION moved p5.1 -> p7.1.
      .
      Two quality floors are DERIVED from the widening rather than configured:
      ProjectPolicy.fan_out_criteria requires isolated_candidates + candidate_selection
      where a stage actually fanned out as candidates, and diverse_review where it fanned
      out as lenses. That is deliberate — a `script` task under the free objective is never
      asked for candidates it has no business having, and a widened `ordinary` lane cannot
      have its candidate_select stage edited out (tests/workflows/test_candidates.py pins
      the refusal). The checks read the composed NODES: isolated_candidates counts distinct
      (candidate_id, exclusive resource_id) pairs, so two nodes labelled c1/c2 contending
      for one `worktree:<task>` lease do not satisfy it.
      .
      Each candidate implementer node carries `params['candidate_id']` AND
      `resource_request['resource_id'] = worktree:<task>/<c>`. The second is load-bearing:
      without it runner.resource_id_for falls back to `worktree:<task>` and N candidates
      queue for one directory, which is cross-pollution with extra steps rather than
      isolation.
      .
      Hybrid (§3.1) is an eligibility overlay and EXECUTION_OBJECTIVES still has two
      members. HybridPolicy names the roles that may additionally spend paid categories
      under the free objective; router._permitted_billing takes the role id and unions
      _hybrid_grant() onto OBJECTIVE_BILLING, read entirely through getattr so the existing
      Policy test doubles in tests/backends/test_router.py keep working. It applies under
      free_quality only — a 'hybrid' reading of paid mode would just be paid mode.
      .
      Three deviations from the directive's file list, none a design change. (1)
      maestro/workflows/candidates.py is NEW and not in the list; the join needed a home
      and the phase file's checklist item 5 asks for it. (2) maestro/workflows/policy.py,
      compiler.py, handlers.py, backends/router.py and
      maestro/templates/workflows/project.yaml were MODIFIED. (3) Two P5 assertions in
      tests/workflows/test_compiler.py were updated for the widened free-mode shape

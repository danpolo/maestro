      implementer of any width; test_the_planner_and_the_reviewer_never_take_a_writer_lease
      now iterates every planner/reviewer node instead of looking up 'proof_review' by
      name). Both still assert the same property. Also fixed:
      compiler.FRAGMENTS' proof_review builder discarded the node_id it was handed, which
      only mattered once a stage could fan out; compose() now refuses a fragment that
      ignores its id, naming the fragment.

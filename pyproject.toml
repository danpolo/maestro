[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.2.0"
description = "Project-agnostic autonomous orchestration system"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "python-dotenv>=1.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.0"]
# Layer 1 structural provider (D07). Optional: Layer 0 answers every query without it.
# The parser and each grammar carry their own row in maestro/thirdparty.json ([INV-A09]).
structural = ["tree-sitter>=0.25.2", "tree-sitter-python>=0.25.0"]

[project.scripts]
maestro = "maestro.cli:main"

[tool.setuptools.packages.find]
include = ["maestro*"]

[tool.setuptools.package-data]
maestro = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: exercises a real maestro subprocess (init/run/doctor) rather than an in-process call; excluded by `pytest -m \"not slow\"` fast-tier runs, still included in a bare `pytest`.",
    "real_fsync: uses the real os.fsync and the store's production SQLite sync setting; every other test gets tests/conftest.py's stand-ins, which skip the flush to disk.",
]

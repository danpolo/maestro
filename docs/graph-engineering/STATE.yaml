      .
      Design choices worth knowing. (1) The index is a snapshot registry + parse cache keyed
      (path, content_hash, extractor), NOT a whole-repo symbol index: queries grep for
      candidates then parse only those, so no query needs a prebuilt index and deleting
      .orchestrator/repository.sqlite3 loses only speed. (2) Only a commit id is a base
      snapshot; a branch name is refused because it moves. (3) Overlay id =
      hash(base, worktree realpath, edit fingerprint), so two worktrees never share rows even
      with identical edits. (4) Stale overlay -> StaleSnapshotError by default; on_stale="flag"
      answers `partial` with the drifted paths excluded (read from base). (5) A partial
      tree-sitter parse is supplemented lexically: error recovery can swallow a later `def`
      into an ERROR node (found by test). (6) ContextManifest withholding lives in
      context.ROLE_PROFILES keyed by role_id and is applied before the budget; an unknown role
      fails closed; mandatory instructions + acceptance criteria are counted first and never
      cut, and an overrun is reported in unresolved_queries.

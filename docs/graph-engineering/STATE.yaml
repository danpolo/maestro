    notes: >-
      Ran after P07 because that is what the plan says, not by improvisation: the specs
      README's phase graph puts P11 on the CORE CRITICAL PATH straight after P7, with
      P8/P9/P10 as a parallel "Conditional Enhancements" branch, and both branches converge
      on P12. The phase file's "Depends On: P01-P07" agrees. STATE.yaml already named P11 as
      current when this session opened. P12 must wait for BOTH branches, so `current_phase`
      was set to P08 (not P12) after this phase: P08's own dependencies (P03, P06, and
      candidate scheduling after P07) are all satisfied.
      .
      OPERATOR PROJECTIONS live in maestro/status.py, under a banner, below the verbatim
      reference reader. One read (`workflow_view`) produces one document that three
      renderings share — text, `--html`, and `explain_view` — so the three cannot disagree
      about what a run did. `maestro workflow show <task_id> [--html|--json]` and
      `maestro explain <task_id>` are the CLI surface; `/workflow <id>` and `/explain <id>`
      are the same two over Telegram (hitl/commands.py), and both are also `maestro ctl`
      verbs. The store is opened as a CLIENT — [INV-01] — and
      test_reading_a_view_writes_nothing pins that the head sequence does not move.
      .
      A CORRECTION WORTH CARRYING: `WorkflowRevision.terminal_requirements` is a tuple of
      terminal NODE IDS, not of engineering criteria (models._structural_issues enforces
      it). The criteria are the compiler's `CRITERION_CHECKS` and are NOT stored on the
      revision, so `explain_view` walks every entry of CRITERION_CHECKS against the stored
      nodes rather than reading a required list off the policy: the policy is a live file and
      reading it now would answer with today's requirements about a graph compiled under
      `policy_hash`. A graph could not have compiled unless it satisfied what was required of
      it, so what `explain` shows as bound is a superset of what was demanded. An unbound
      criterion is reported, never omitted.
      .
      "Binding" in the trace is the DURABLE binding (role, permissions_ref, resource_id,
      candidate/lens, attempts). P06's AgentBinding is observed on an in-memory BaselineTrace
      and never persisted, so nothing about routing is claimed; re-resolving the router now
      would report today's catalog as the one the run used. If P12 wants routing in `explain`,
      the missing piece is persisting ROUTE_RESOLVED into the event stream.
      .
      SECRET-FREE EXPORT is structural first, redaction second. `_html_payload` is an
      ALLOW-LIST of fields (so a control-schema column added next year does not ship to the
      page by default) and event payloads are dropped outright, because an event body is
      handler output. `status.redact_secrets` then runs over every string; it deliberately
      does NOT match hex digests (a 40/64-char hex string is a sha or a fingerprint — the
      evidence the page exists to show). `notify_telegram` and `dan_request._send_telegram`
      now redact too: Telegram is the one place maestro's internal text leaves the machine.
      `telegram.send_report` splits a long report on line boundaries — Telegram REJECTS a
      body over ~4096 chars outright rather than truncating, so a graph view would simply
      never arrive.
      .
      PER-PROJECT PIN ([INV-09]): `<repo>/.orchestrator/current`, read by
      `bootstrap.adopted_root` BEFORE `~/.maestro/current`. `bootstrap.repo_from_argv` parses
      `--repo` / `--repo=` / `$MAESTRO_REPO` with the standard library only — no argparse, no
      maestro import — and deliberately does NOT fall back to the cwd the way
      `cli._resolve_repo` does: an inferred pin would redirect a maestro invoked from inside
      project A while it is operating project B. `selfupdate.adopt` writes the project pin
      XOR the machine-global one, never both: writing both would move every unpinned project
      on the host, which is the drift the invariant forbids. The cost (a host whose projects
      all pin stops advancing its global default) is correct, because nothing runs from it.
      `doctor`'s adopted_code check now reports against whichever pointer actually redirected.
      .
      SERVICE LIFECYCLE ([INV-10]): the shipped template ALREADY had Type=forking +
      `tmux new-session -d -s <session> -n main` + an `ExecStartPre=-... kill-session`, so
      nothing was regenerated. What was missing was (a) a predicate over the unit that
      actually runs — `watchdog.service_unit_conforms`, which reads the rendered text, since
      the copy in /etc/systemd/system is the one an operator may have hand-edited — and (b)
      the live half: `watchdog.request_lease_reconciliation` was a DEAD SEAM with no caller.
      It is now called at watchdog start (a production watchdog start IS a service start:
      reboot, `systemctl restart`, controller crash) and again after a stall-kill, before the
      relaunch. The watchdog still only ASKS; [INV-01] keeps the scan in the controller.
      .
      One test-suite hazard found and contained, worth knowing: every `cmd_*` sets
      `os.environ["MAESTRO_REPO"]` and never restores it, so an in-process `cli.main` call
      leaks a project root into the rest of the pytest session (it made three
      tests/test_selfupdate.py assertions fail a long way from the cause). Contained by an
      autouse fixture in tests/test_workflow_status.py. Note that
      `monkeypatch.delenv(name, raising=False)` does NOT contain it — monkeypatch records
      nothing to undo when the variable is already absent.


